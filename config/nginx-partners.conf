server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Serve DCAT catalogues as JSON-LD, readable from other origins (harvesters, browsers).
    location ~ \.jsonld$ {
        types { }
        default_type application/ld+json;
        charset_types application/ld+json;
        add_header Access-Control-Allow-Origin *;
    }

}
